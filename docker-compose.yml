services:
  a2pdf:
    build: .
    image: a2pdf:latest
    container_name: a2pdf
    ports:
      - "8000:8000"
    environment:
      A2PDF_WORKERS: "2"          # сколько документов собираем одновременно
      A2PDF_TIMEOUT: "120"        # секунд на один документ
      A2PDF_MAX_UPLOAD: "20971520"
      # вход в сервис: хеш пароля делается командой python -m a2pdf.auth
      A2PDF_USER: "${A2PDF_USER:-admin}"
      A2PDF_PASSWORD_HASH: "${A2PDF_PASSWORD_HASH:?задайте хеш пароля}"
      A2PDF_SECRET: "${A2PDF_SECRET:?задайте секрет для подписи сессий}"
      # для закрытых страниц Notion: токен internal integration
      NOTION_TOKEN: "${NOTION_TOKEN:-}"
    restart: unless-stopped
    tmpfs:
      - /tmp
    # chromium в контейнере требует больше /dev/shm, чем даёт docker по умолчанию
    shm_size: "512m"
