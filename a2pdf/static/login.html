<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · Документы</title>
<link rel="stylesheet" href="/fonts.css">
<style>
:root{
  --navy:#0B2660; --navy-900:#06173B; --navy-100:#E3EAF4;
  --blue:#1FA8FC; --blue-700:#1289D5; --blue-50:#F1F8FF;
  --amber:#FF9F1C;
  --n0:#FFFFFF; --n50:#F7F8FA; --n200:#E1E4EA;
  --n400:#9CA3AF; --n500:#6B7280; --n700:#374151; --n900:#111722;
  --font:'Inter','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:15px;color:var(--n700);background:var(--navy);
     min-height:100vh;display:flex;align-items:center;justify-content:center;
     padding:24px;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
body::after{content:"";position:absolute;top:-200px;right:-160px;width:520px;height:520px;
  border-radius:50%;background:radial-gradient(circle,rgba(31,168,252,.32) 0,
  rgba(31,168,252,0) 65%)}

.card{position:relative;z-index:1;width:100%;max-width:380px;background:var(--n0);
      border-radius:16px;padding:32px;box-shadow:0 24px 60px rgba(6,23,59,.35)}
.brands{display:flex;align-items:center;gap:16px;margin-bottom:24px;min-height:20px}
.brands img{height:18px;width:auto;display:block}
.brands span{width:1px;height:16px;background:var(--n200)}
h1{font-size:20px;font-weight:700;color:var(--navy);letter-spacing:-.4px}
.lead{font-size:13.5px;color:var(--n500);margin:6px 0 22px}

label{display:block;font-size:12.5px;font-weight:500;color:var(--n500);margin-bottom:6px}
input{width:100%;font:15px var(--font);color:var(--n900);border:1px solid var(--n200);
      border-radius:8px;padding:11px 12px;background:var(--n0);margin-bottom:14px}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
button{width:100%;background:var(--navy);color:#fff;border:0;border-radius:8px;
       padding:12px;font:600 15px var(--font);cursor:pointer}
button:hover{background:var(--navy-900)}
.error{background:#FEF3F2;border-left:3px solid #B42318;color:#B42318;font-size:13px;
       border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:16px}
.foot{margin-top:20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;
      color:var(--n400);text-align:center}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="brands" id="brands"></div>
    <h1>Вход в сервис</h1>
    <p class="lead">Сборка фирменных документов: PDF и Word по брендбуку.</p>
    {{error}}
    <label for="username">Логин</label>
    <input id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>
    <button type="submit">Войти</button>
    <div class="foot">Внутренний сервис</div>
  </form>
<script>
fetch('/brands-public').then(r => r.json()).then(data => {
  const box = document.getElementById('brands');
  box.innerHTML = (data.brands || []).map((b, i) =>
    (i ? '<span></span>' : '') + `<img src="/logo/${b}-color" alt="">`).join('');
}).catch(() => {});
</script>
</body>
</html>
